<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>چت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1419;--sidebar:#17212b;--chat-bg:#0e1621;--surface:#17212b;--surface-2:#1c2733;--text:#e1e8f0;--text-secondary:#7d8b99;--border:#101921;--accent:#5288c1;--accent-hover:#6ba0d3;--msg-self:#2b5278;--msg-other:#1c2733;--online:#4dcd5e;--danger:#e74c3c;--unread:#e74c3c;--shadow:0 4px 20px rgba(0,0,0,.5)}
[data-theme="light"]{--bg:#f0f2f5;--sidebar:#fff;--chat-bg:#e6ebee;--surface:#fff;--surface-2:#f1f3f5;--text:#1a1a1a;--text-secondary:#707579;--border:#e0e3e6;--accent:#3390ec;--accent-hover:#4ba3f0;--msg-self:#eeffde;--msg-other:#fff;--shadow:0 4px 20px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;transition:background .3s,color .3s}
input,textarea,button{font-family:inherit;font-size:16px}
.hidden{display:none!important}
.register-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
.register-box{background:var(--surface);padding:35px 25px;border-radius:20px;width:100%;max-width:400px;box-shadow:var(--shadow);text-align:center}
.register-box h1{margin-bottom:8px;font-size:24px}
.register-box p{color:var(--text-secondary);margin-bottom:20px;font-size:14px}
.register-box input{width:100%;padding:13px 16px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;outline:none}
.register-box input:focus{border-color:var(--accent)}
.register-box button{width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.register-box button:hover{background:var(--accent-hover)}
.register-box .hint{font-size:12px;color:var(--text-secondary);margin-bottom:10px}
.error-msg{color:var(--danger);font-size:13px;margin-top:10px}
.sidebar{width:340px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.self-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:16px;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center;position:relative}
.self-avatar::after{content:'📷';position:absolute;bottom:-4px;right:-4px;font-size:12px;background:var(--accent);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.self-avatar:hover::after{opacity:1}
.self-info{flex:1;overflow:hidden}
.self-info .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.self-info .id{font-size:12px;color:var(--text-secondary)}
.header-btn{background:transparent;border:none;color:var(--text-secondary);font-size:18px;padding:8px;border-radius:50%;cursor:pointer;transition:.2s;flex-shrink:0}
.header-btn:hover{background:var(--surface-2);color:var(--text)}
.search-bar{padding:8px 14px;display:flex;gap:8px}
.search-bar input{flex:1;padding:10px 16px;background:var(--surface-2);border:none;border-radius:20px;color:var(--text);font-size:14px;outline:none}
.new-group-btn{background:var(--accent);border:none;border-radius:50%;width:40px;height:40px;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;transition:.2s}
.new-group-btn:hover{background:var(--accent-hover)}
.contact-list{flex:1;overflow-y:auto;padding:4px 8px}
.contact-list::-webkit-scrollbar{width:6px}
.contact-list::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:3px}
.section-label{padding:12px 12px 6px;font-size:12px;color:var(--text-secondary);font-weight:600;letter-spacing:.5px}
.contact-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s;margin-bottom:2px}
.contact-item:hover{background:var(--surface-2)}
.contact-item.active{background:var(--accent);color:#fff}
.contact-item.active .contact-name,.contact-item.active .contact-preview{color:#fff!important}
.contact-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:18px;flex-shrink:0;position:relative;background-size:cover;background-position:center}
.online-dot{position:absolute;bottom:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--online);border:2px solid var(--sidebar)}
.contact-info{flex:1;overflow:hidden;min-width:0}
.contact-name{font-weight:600;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-preview{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unread-badge{background:var(--unread);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;min-width:20px;text-align:center}
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);min-width:0}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:15px;flex-direction:column;gap:15px;padding:30px;text-align:center}
.chat-empty .icon{font-size:64px;opacity:.4}
.chat-header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-header .back-btn{display:none;background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;background-size:cover;background-position:center;flex-shrink:0}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-status{font-size:12px;color:var(--text-secondary);margin-top:2px}
.chat-header-actions{display:flex;gap:2px}
.messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background-size:cover;background-position:center}
.messages-area::-webkit-scrollbar{width:6px}
.messages-area::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:3px}
.message{max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;word-wrap:break-word;position:relative;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.self{align-self:flex-end;background:var(--msg-self);color:var(--text);border-bottom-left-radius:3px}
.message.other{align-self:flex-start;background:var(--msg-other);color:var(--text);border-bottom-right-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.message.system{align-self:center;background:transparent;color:var(--text-secondary);font-size:12px;padding:4px 12px;text-align:center}
.message .sender{font-size:12px;font-weight:600;margin-bottom:3px;color:var(--accent)}
.message .meta{font-size:10px;color:var(--text-secondary);text-align:left;margin-top:3px;opacity:.85;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.message.other .meta{justify-content:flex-start}
.message .media{max-width:100%;max-height:300px;border-radius:8px;margin-top:6px;cursor:pointer;display:block}
.message .file-link{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);padding:8px 12px;border-radius:8px;margin-top:6px;text-decoration:none;color:var(--accent);font-size:13px}
.message .reply-block{border-right:3px solid var(--accent);padding:4px 8px;margin-bottom:4px;font-size:12px;opacity:.85;background:rgba(0,0,0,.15);border-radius:4px}
.message .reply-btn{background:transparent;border:none;color:var(--text-secondary);font-size:12px;cursor:pointer;padding:0 4px;opacity:.6}
.message .reply-btn:hover{opacity:1;color:var(--accent)}
.voice-msg{display:flex;align-items:center;gap:10px;padding:8px 4px;min-width:180px}
.voice-play{background:var(--accent);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;flex-shrink:0}
.voice-wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.voice-wave span{flex:1;background:var(--accent);border-radius:2px;opacity:.4}
.voice-time{font-size:11px;color:var(--text-secondary);flex-shrink:0}
.reply-preview-bar{display:none;padding:8px 16px;background:var(--surface-2);border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary);align-items:center;justify-content:space-between}
.reply-preview-bar .close{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;font-size:18px}
.input-area{padding:10px 12px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.input-area input[type="text"]{flex:1;padding:11px 16px;background:var(--surface-2);border:none;border-radius:22px;color:var(--text);font-size:15px;outline:none;min-width:0}
.input-area input[type="text"]:focus{box-shadow:0 0 0 2px var(--accent)}
.icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.send{background:var(--accent);color:#fff}
.icon-btn.send:hover{background:var(--accent-hover)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.recording-bar{display:none;padding:12px 16px;background:var(--danger);color:#fff;align-items:center;gap:12px;justify-content:space-between}
.recording-bar.visible{display:flex}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.recording-bar button{background:rgba(255,255,255,.25);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px}
.recording-bar button:hover{background:rgba(255,255,255,.4)}
#fileInput,#bgInput,#avatarInput{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:20px;padding:24px;max-width:400px;width:100%;box-shadow:var(--shadow);position:relative;max-height:90vh;overflow-y:auto}
.modal-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#fff;margin:0 auto 16px;background-size:cover;background-position:center}
.modal h2{margin-bottom:16px;text-align:center}
.modal .modal-id{color:var(--text-secondary);font-size:14px;margin-bottom:6px;text-align:center}
.modal .modal-status{color:var(--online);font-size:13px;margin-bottom:20px;text-align:center}
.modal .modal-status.offline{color:var(--text-secondary)}
.modal .field{width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;outline:none;margin-bottom:12px}
.modal .member-list{max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:14px}
.modal .member-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.modal .member-item:hover{background:var(--surface-2)}
.modal .member-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer}
.modal button.primary{width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.modal button.primary:hover{background:var(--accent-hover)}
.modal .close-btn{position:absolute;top:12px;left:12px;background:transparent;border:none;color:var(--text-secondary);font-size:24px;cursor:pointer}
@media(max-width:700px){
  .sidebar{width:100%;position:fixed;inset:0;z-index:10}
  .chat-main{position:fixed;inset:0;z-index:20;display:none}
  .chat-main.open{display:flex}
  .chat-header .back-btn{display:block}
  .message{max-width:85%}
}
@media(max-width:400px){
  .register-screen{padding:10px}
  .register-box{padding:25px 18px;border-radius:16px}
  .register-box h1{font-size:20px}
  .register-box p{font-size:13px;margin-bottom:16px}
}
</style>
</head>
<body>

<input type="file" id="avatarInput" accept="image/*">

<div class="register-screen" id="registerScreen">
  <div class="register-box">
    <h1>👋 خوش آمدید</h1>
    <p>یک شناسه و نام برای خود انتخاب کنید</p>
    <input type="text" id="regId" placeholder="شناسه (ali_2025)" maxlength="20" autocomplete="off">
    <div class="hint">شناسه باید یکتا و انگلیسی باشد (۳-۲۰ کاراکتر)</div>
    <input type="text" id="regName" placeholder="نام نمایشی" maxlength="30">
    <button onclick="registerUser()">ورود به چت</button>
    <div class="error-msg hidden" id="regError"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="self-avatar" id="selfAvatar" onclick="document.getElementById('avatarInput').click()">?</div>
    <div class="self-info">
      <div class="name" id="selfName">...</div>
      <div class="id" id="selfId">...</div>
    </div>
    <button class="header-btn" onclick="toggleTheme()" title="تم">🌓</button>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="جستجو...">
    <button class="new-group-btn" onclick="showCreateGroup()" title="گروه جدید">+</button>
  </div>
  <div class="contact-list" id="contactList"></div>
</div>

<div class="chat-main" id="chatMain">
  <div class="chat-empty" id="chatEmpty">
    <div class="icon">💬</div>
    <div>یک مخاطب یا گروه را انتخاب کنید</div>
  </div>
  <div class="hidden" id="chatView" style="display:none;flex-direction:column;height:100%;">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChatMobile()">→</button>
      <div class="chat-header-avatar" id="chatAvatar"></div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatName">...</div>
        <div class="chat-header-status" id="chatStatus">...</div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" onclick="document.getElementById('bgInput').click()" title="پس‌زمینه">🎨</button>
        <button class="icon-btn" onclick="deleteCurrentChat()" title="حذف چت">🗑️</button>
      </div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="reply-preview-bar" id="replyPreviewBar">
      <span id="replyPreviewText"></span>
      <button class="close" onclick="cancelReply()">×</button>
    </div>
    <div class="recording-bar" id="recordingBar">
      <span class="rec-dot"></span>
      <span id="recTime">0:00</span>
      <span style="flex:1">در حال ضبط...</span>
      <button onclick="cancelRecording()">لغو</button>
      <button onclick="stopRecording(true)">ارسال</button>
    </div>
    <div class="input-area" id="inputArea">
      <input type="file" id="fileInput" accept="image/*,video/*,audio/*,application/*">
      <input type="file" id="bgInput" accept="image/*">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="text" id="messageInput" placeholder="پیام..." autocomplete="off">
      <button class="icon-btn" id="micBtn" onclick="startRecording()">🎤</button>
      <button class="icon-btn send" onclick="sendMessage()" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wspvdrxsdbmpomeuczwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SDXc2OU1Sy77WPdnBrxyWw_aT3josm9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COLORS = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4','#ef4444','#6366f1','#14b8a6','#f97316'];

let currentUser=null,onlineUsers=new Set(),currentChat=null,currentChannel=null;
let globalPresence=null,allProfiles=[],userGroups=[],unreadCounts={},replyTarget=null;
let mediaRecorder=null,recordedChunks=[],recTimer=null,recordStartTime=null,typingTimer=null;

const $=id=>document.getElementById(id);
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function colorFor(id){return COLORS[hashCode(id)%COLORS.length]}
function initials(n){return n?n.slice(0,2).toUpperCase():'?'}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(iso){const d=new Date(iso),n=new Date();const diff=(n-d)/1000;if(diff<60)return 'الان';if(diff<3600)return Math.floor(diff/60)+' د';if(d.toDateString()===n.toDateString())return d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('fa-IR',{month:'short',day:'numeric'})}
function lastSeenText(iso){if(!iso)return 'آفلاین';const d=new Date(iso),n=new Date();const diff=(n-d)/60000;if(diff<1)return 'همین الان';if(diff<60)return `${Math.floor(diff)} دقیقه پیش`;if(diff<1440)return `${Math.floor(diff/60)} ساعت پیش`;return `آخرین بازدید: ${d.toLocaleDateString('fa-IR')}`}
function privateRoomId(a,b){return 'private:'+[a,b].sort().join(':')}
function cacheGet(r){try{return JSON.parse(localStorage.getItem('cache_'+r)||'[]')}catch{return []}}
function cacheSet(r,m){if(m.length>200)m=m.slice(-200);try{localStorage.setItem('cache_'+r,JSON.stringify(m))}catch{}}
function cacheAppend(r,m){const a=cacheGet(r);if(!a.find(x=>String(x.id)===String(m.id))){a.push(m);cacheSet(r,a)}}
function toggleTheme(){const h=document.documentElement;const n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('theme',n)}
if(localStorage.getItem('theme'))document.documentElement.setAttribute('data-theme',localStorage.getItem('theme'));

async function registerUser(){
  const id=$('regId').value.trim().toLowerCase();
  const name=$('regName').value.trim();
  const e=$('regError');
  if(!id||!name){e.textContent='همه فیلدها را پر کنید';e.classList.remove('hidden');return}
  if(!/^[a-z0-9_]{3,20}$/.test(id)){e.textContent='شناسه فقط حروف کوچک انگلیسی، عدد و _';e.classList.remove('hidden');return}
  const {data:ex}=await sb.from('profiles').select('id').eq('id',id).maybeSingle();
  if(ex){e.textContent='این شناسه قبلاً استفاده شده';e.classList.remove('hidden');return}
  const {error}=await sb.from('profiles').insert({id,display_name:name});
  if(error){e.textContent='خطا: '+error.message;e.classList.remove('hidden');return}
  localStorage.setItem('chat_user_id',id);location.reload();
}

async function init(){
  const savedId=localStorage.getItem('chat_user_id');
  if(!savedId)return;
  const {data:p}=await sb.from('profiles').select('*').eq('id',savedId).maybeSingle();
  if(!p){localStorage.removeItem('chat_user_id');location.reload();return}
  if(!p.is_active){alert('حساب شما غیرفعال شده');localStorage.removeItem('chat_user_id');location.reload();return}
  currentUser=p;
  $('registerScreen').classList.add('hidden');
  renderSelfAvatar();
  $('selfName').textContent=p.display_name;
  $('selfId').textContent='@'+p.id;

  globalPresence=sb.channel('presence:global',{config:{presence:{key:p.id}}});
  globalPresence.on('presence',{event:'sync'},()=>{
    onlineUsers=new Set(Object.keys(globalPresence.presenceState()));
    refreshContactList();updateChatHeaderStatus();
  });
  globalPresence.subscribe(async s=>{
    if(s==='SUBSCRIBED')await globalPresence.track({online_at:new Date().toISOString()});
  });

  // heartbeat آخرین بازدید
  setInterval(async()=>{
    await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',currentUser.id);
  },60000);
  await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',currentUser.id);

  await loadProfiles();await loadGroups();await computeUnread();

  sb.channel('profiles-watch').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>loadProfiles()).subscribe();
  sb.channel('offline-watch').on('postgres_changes',{event:'INSERT',schema:'public',table:'offline_messages'},()=>{computeUnread().then(refreshContactList)}).subscribe();

  $('messageInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage()});
  $('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)uploadMedia(f);e.target.value=''});
  $('bgInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)uploadBackground(f);e.target.value=''});

function renderSelfAvatar(){

async function uploadAvatar(file){
  if(!file.type.startsWith('image/')){alert('فقط عکس');return}
  if(file.size>5*1024*1024){alert('حداکثر ۵MB');return}
  const path=`avatars/${currentUser.id}.${file.name.split('.').pop()}`;
  const {error}=await sb.storage.from('chat-media').upload(path,file,{upsert:true});
  if(error){alert('خطا: '+error.message);return}
  const {data:u}=sb.storage.from('chat-media').getPublicUrl(path);
  await sb.from('profiles').update({avatar_url:u.publicUrl}).eq('id',currentUser.id);
  currentUser.avatar_url=u.publicUrl;
  renderSelfAvatar();
  refreshContactList();
}

async function loadProfiles(){
  const {data}=await sb.from('profiles').select('*').eq('is_active',true).neq('id',currentUser.id).order('display_name');
  allProfiles=data||[];refreshContactList();
}

async function loadGroups(){
  const {data:m}=await sb.from('room_members').select('room_id').eq('user_id',currentUser.id);
  if(!m||m.length===0){userGroups=[];refreshContactList();return}
  const {data}=await sb.from('rooms').select('*').in('id',m.map(x=>x.room_id));
  userGroups=data||[];refreshContactList();
}

async function computeUnread(){
  const {data:st}=await sb.from('user_read_status').select('*').eq('user_id',currentUser.id);
  const rm={};(st||[]).forEach(s=>rm[s.room_id]=s.last_read_at);
  const c={};
  const {data:pr}=await sb.from('offline_messages').select('room_id,sender_id,created_at').like('room_id','private:%');
  (pr||[]).forEach(m=>{
    if(m.sender_id===currentUser.id||!m.room_id.includes(currentUser.id))return;
    const lr=rm[m.room_id];
    if(!lr||new Date(m.created_at)>new Date(lr))c[m.room_id]=(c[m.room_id]||0)+1;
  });
  for(const g of userGroups){
    const lr=rm[g.id];
    let q=sb.from('group_messages').select('*',{count:'exact',head:true}).eq('room_id',g.id).neq('sender_id',currentUser.id);
    if(lr)q=q.gt('created_at',lr);
    const {count}=await q;
    if(count>0)c[g.id]=count;
  }
  unreadCounts=c;
}

function refreshContactList(){
  const list=$('contactList');
  const search=$('searchInput').value.toLowerCase();
  list.innerHTML='';
  if(userGroups.length>0){
    const lb=document.createElement('div');lb.className='section-label';lb.textContent='گروه‌ها';list.appendChild(lb);
    userGroups.filter(g=>!search||g.name.toLowerCase().includes(search)).forEach(g=>{
      list.appendChild(buildItem({type:'group',id:g.id,name:g.name,emoji:g.avatar_emoji||'👥',unread:unreadCounts[g.id]||0}));
    });
  }
  const lb2=document.createElement('div');lb2.className='section-label';lb2.textContent='مخاطبین';list.appendChild(lb2);
  allProfiles.filter(p=>!search||p.display_name.toLowerCase().includes(search)||p.id.includes(search)).forEach(p=>{
    const rid=privateRoomId(currentUser.id,p.id);
    list.appendChild(buildItem({type:'private',id:p.id,name:p.display_name,online:onlineUsers.has(p.id),unread:unreadCounts[rid]||0,avatarUrl:p.avatar_url,avatarId:p.id}));
  });
}

function buildItem({type,id,name,emoji,online,unread,avatarUrl,avatarId}){
  const el=document.createElement('div');el.className='contact-item';
  if(currentChat&&currentChat.type===type&&currentChat.id===id)el.classList.add('active');
  const av=document.createElement('div');av.className='contact-avatar';
  if(avatarUrl){av.style.backgroundImage=`url('${avatarUrl}')`}
  else{av.textContent=emoji||initials(name);av.style.background=type==='group'?'#8b5cf6':colorFor(avatarId||id)}
  if(type==='private'&&online){const d=document.createElement('div');d.className='online-dot';av.appendChild(d)}
  const info=document.createElement('div');info.className='contact-info';
  const preview=type==='group'?'گروه':(online?'آنلاین':'آفلاین');
  info.innerHTML=`<div class="contact-name">${esc(name)}</div><div class="contact-preview">${preview}</div>`;
  const meta=document.createElement('div');meta.className='contact-meta';
  if(unread>0)meta.innerHTML=`<div class="unread-badge">${unread>99?'99+':unread}</div>`;
  el.appendChild(av);el.appendChild(info);el.appendChild(meta);
  el.onclick=()=>{type==='private'?openPrivateChat(id):openGroup(id)};
  el.oncontextmenu=e=>{e.preventDefault();if(type==='private')showProfile(id)};
  return el;
}

function showProfile(userId){

async function openPrivateChat(otherId){
  const p=allProfiles.find(x=>x.id===otherId);if(!p)return;
  if(currentChannel){await sb.removeChannel(currentChannel);currentChannel=null}
  currentChat={type:'private',id:otherId,roomId:privateRoomId(currentUser.id,otherId),name:p.display_name};
  showChatView(p.display_name,onlineUsers.has(otherId)?'🟢 آنلاین':lastSeenText(p.last_seen),p.avatar_url,colorFor(p.id));
  $('messagesArea').innerHTML='';
  $('chatMain').classList.add('open');
  applyBackground(currentUser.chat_background_url);
  cacheGet(currentChat.roomId).forEach(m=>renderMessage(m,currentChat.roomId));
  await loadOfflineMessages(currentChat.roomId);
  await markAsRead(currentChat.roomId);
  currentChannel=sb.channel('chat:'+currentChat.roomId,{config:{broadcast:{self:true},presence:{key:currentUser.id}}});
  currentChannel.on('broadcast',{event:'msg'},({payload})=>handleIncomingMessage(payload,currentChat.roomId));
  currentChannel.on('broadcast',{event:'typing'},({payload})=>{
    if(payload.user_id!==currentUser.id)showTyping(payload.name);
  });
  currentChannel.on('presence',{event:'sync'},()=>{
    const o=Object.keys(currentChannel.presenceState()).filter(k=>k!==currentUser.id);
    $('chatStatus').textContent=o.length>0?'🟢 آنلاین':lastSeenText(p.last_seen);
  });
  currentChannel.subscribe(async s=>{
    if(s==='SUBSCRIBED'){
      await currentChannel.track({user_id:currentUser.id});
      $('messageInput').disabled=false;$('sendBtn').disabled=false;
      $('messageInput').focus();
    }
  });
  refreshContactList();
}

function showTyping(name){
  const area=$('messagesArea');
  let t=area.querySelector('.typing-bubble');
  if(!t){
    t=document.createElement('div');t.className='message other typing-bubble';
    t.innerHTML=`<em style="font-size:12px;opacity:.7">${esc(name)} در حال تایپ...</em>`;
    area.appendChild(t);area.scrollTop=area.scrollHeight;
  }
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.remove(),2500);
}

async function loadOfflineMessages(rid){
  const {data}=await sb.from('offline_messages').select('*').eq('room_id',rid).neq('sender_id',currentUser.id).order('created_at');
  if(!data||data.length===0)return;
  data.forEach(m=>renderMessage({id:'offline-'+m.id,sender_id:m.sender_id,sender_name:m.sender_name,content:m.content,media_url:m.media_url,media_type:m.media_type,media_duration:m.media_duration,created_at:m.created_at},rid));
  await sb.from('offline_messages').delete().in('id',data.map(m=>m.id));
  await computeUnread();
}

async function openGroup(rid){
  const g=userGroups.find(x=>x.id===rid);if(!g)return;
  if(currentChannel){await sb.removeChannel(currentChannel);currentChannel=null}
  currentChat={type:'group',id:rid,roomId:rid,name:g.name};
  showChatView(g.name,'گروه',null,'#8b5cf6',g.avatar_emoji||'👥');
  $('messagesArea').innerHTML='';
  $('chatMain').classList.add('open');
  applyBackground(currentUser.chat_background_url);
  const cached=cacheGet(rid);
  cached.forEach(m=>renderMessage(m,rid));
  await markAsRead(rid);
  const {data}=await sb.from('group_messages').select('*').eq('room_id',rid).order('created_at').limit(200);
  const seen=new Set(cached.map(m=>String(m.id)));
  (data||[]).forEach(m=>{if(!seen.has(String(m.id))){renderMessage(m,rid);cacheAppend(rid,m)}});
  currentChannel=sb.channel('group:'+rid);
  currentChannel.on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages',filter:'room_id=eq.'+rid},p=>{
    if(p.new.sender_id===currentUser.id)return;
    renderMessage(p.new,rid);cacheAppend(rid,p.new);
  });
  currentChannel.subscribe(s=>{
    if(s==='SUBSCRIBED'){
      $('messageInput').disabled=false;$('sendBtn').disabled=false;
      $('messageInput').focus();
    }
  });
  refreshContactList();
}

function renderMessage(msg,rid){
  const area=$('messagesArea');
  const self=msg.sender_id===currentUser.id;
  const div=document.createElement('div');
  div.className='message '+(self?'self':'other');
  div.dataset.id=msg.id;
  let html='';
  if(!self&&currentChat?.type==='group')html+=`<div class="sender">${esc(msg.sender_name)}</div>`;
  if(msg.reply_to_id){
    const r=cacheGet(rid).find(m=>String(m.id)===String(msg.reply_to_id));
    if(r)html+=`<div class="reply-block">↩️ ${esc(r.sender_name)}: ${esc((r.content||'').slice(0,50))}</div>`;
  }
  if(msg.content)html+=`<div>${esc(msg.content)}</div>`;
  if(msg.media_url){
    const mt=msg.media_type||'';
    if(mt.startsWith('audio/')){
      const dur=msg.media_duration||0;
      html+=`<div class="voice-msg"><button class="voice-play" onclick="playVoice(this,'${msg.media_url}')">▶</button>
        <div class="voice-wave">${Array(20).fill(0).map((_,i)=>`<span style="height:${4+Math.random()*20}px"></span>`).join('')}</div>
        <span class="voice-time">${formatDuration(dur)}</span></div>`;
    } else if(mt.startsWith('image/')||/\.(jpg|jpeg|png|gif|webp)$/i.test(msg.media_url)){
      html+=`<img class="media" src="${msg.media_url}" onclick="window.open('${msg.media_url}','_blank')">`;
    } else if(mt.startsWith('video/')||/\.(mp4|webm|mov)$/i.test(msg.media_url)){
      html+=`<video class="media" controls src="${msg.media_url}"></video>`;
    } else {
      html+=`<a class="file-link" href="${msg.media_url}" target="_blank">📎 دانلود فایل</a>`;
    }
  }
  html+=`<div class="meta"><span>${fmtTime(msg.created_at)}</span>`;
  if(currentChat?.type==='group'&&!self)html+=`<button class="reply-btn" onclick="setReply('${msg.id}')">↩️</button>`;
  html+=`</div>`;
  div.innerHTML=html;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function formatDuration(s){const m=Math.floor(s/60);const sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}

function playVoice(btn,url){
  const audio=new Audio(url);
  audio.play();
  btn.textContent='⏸';
  btn.onclick=()=>{if(audio.paused){audio.play();btn.textContent='⏸'}else{audio.pause();btn.textContent='▶'}};
  audio.onended=()=>{btn.textContent='▶';btn.onclick=()=>playVoice(btn,url)};
}

function handleIncomingMessage(payload,rid){
  if(payload.sender_id===currentUser.id)return;
  renderMessage(payload,rid);cacheAppend(rid,payload);
}

async function sendMessage(){
  const input=$('messageInput');
  const text=input.value.trim();
  if(!text||!currentChat)return;
  const {data:me}=await sb.from('profiles').select('is_active').eq('id',currentUser.id).maybeSingle();
  if(!me||!me.is_active){alert('حساب غیرفعال');return}
  input.value='';
  const msg={sender_id:currentUser.id,sender_name:currentUser.display_name,content:text,created_at:new Date().toISOString()};
  if(currentChat.type==='private')await sendPrivateMessage(msg);
  else await sendGroupMessage(msg);
}

async function sendPrivateMessage(msg){
  const online=onlineUsers.has(currentChat.id);
  if(online&&currentChannel){
    const payload={...msg,id:'bc-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)};
    await currentChannel.send({type:'broadcast',event:'msg',payload});
    renderMessage(payload,currentChat.roomId);
    cacheAppend(currentChat.roomId,payload);
  } else {
    const {data,error}=await sb.from('offline_messages').insert({room_id:currentChat.roomId,sender_id:msg.sender_id,sender_name:msg.sender_name,content:msg.content,media_url:msg.media_url,media_type:msg.media_type,media_duration:msg.media_duration}).select().single();
    if(!error&&data){renderMessage({...msg,id:'sent-'+data.id},currentChat.roomId);cacheAppend(currentChat.roomId,{...msg,id:'sent-'+data.id})}
  }
}

async function sendGroupMessage(msg){
  const p={room_id:currentChat.roomId,sender_id:msg.sender_id,sender_name:msg.sender_name,content:msg.content,media_url:msg.media_url,media_type:msg.media_type,media_duration:msg.media_duration};
  if(replyTarget)p.reply_to_id=replyTarget.id;
  const {data,error}=await sb.from('group_messages').insert(p).select().single();
  if(!error&&data){renderMessage(data,currentChat.roomId);cacheAppend(currentChat.roomId,data);cancelReply()}
}

function setReply(mid){

async function uploadMedia(file){

}

// ============ ضبط پیام صوتی ============
async function startRecording(){
  if(!currentChat){alert('اول یک چت باز کن');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    recordedChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(recTimer);
      $('recordingBar').classList.remove('visible');
      const blob=new Blob(recordedChunks,{type:'audio/webm'});
      const duration=Math.round((Date.now()-recordStartTime)/1000);
      if(blob.size<1000||duration<1){return}
      await sendVoiceBlob(blob,duration);
    };
    mediaRecorder.start();
    recordStartTime=Date.now();
    $('recordingBar').classList.add('visible');
    $('recTime').textContent='0:00';
    recTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recordStartTime)/1000);
      $('recTime').textContent=formatDuration(s);
      if(s>=120){stopRecording(true)}
    },500);
  }catch(e){alert('دسترسی به میکروفون: '+e.message)}
}

function stopRecording(send){
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
}

function cancelRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.onstop=null;
    mediaRecorder.stop();
    if(mediaRecorder.stream)mediaRecorder.stream.getTracks().forEach(t=>t.stop());
  }
  clearInterval(recTimer);
  $('recordingBar').classList.remove('visible');
  recordedChunks=[];
}

async function sendVoiceBlob(blob,duration){
  const path=`${currentUser.id}/voice-${Date.now()}.webm`;
  const {error}=await sb.storage.from('chat-media').upload(path,blob,{cacheControl:'3600',upsert:false});
  if(error){alert('خطا: '+error.message);return}
  const {data:u}=sb.storage.from('chat-media').getPublicUrl(path);
  const msg={sender_id:currentUser.id,sender_name:currentUser.display_name,content:'',media_url:u.publicUrl,media_type:'audio/webm',media_duration:duration,created_at:new Date().toISOString()};
  if(currentChat.type==='private')await sendPrivateMessage(msg);
  else await sendGroupMessage(msg);
}

  const input=$('messageInput');
  if(input.value.length>0&&Date.now()-lastTypingSent>2000){
    currentChannel.send({type:'broadcast',event:'typing',payload:{user_id:currentUser.id,name:currentUser.display_name}});
    lastTypingSent=Date.now();
  }
},1000);

init();
</script>
