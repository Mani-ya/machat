<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="manifest.json">
<title>چت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1419;--sidebar:#17212b;--chat-bg:#0e1621;--surface:#17212b;--surface-2:#1c2733;--text:#e1e8f0;--text-secondary:#7d8b99;--border:#101921;--accent:#5288c1;--accent-hover:#6ba0d3;--msg-self:#2b5278;--msg-other:#1c2733;--online:#4dcd5e;--danger:#e74c3c;--unread:#e74c3c;--warning:#f59e0b;--success:#10b981;--shadow:0 4px 20px rgba(0,0,0,.5)}
[data-theme="light"]{--bg:#f0f2f5;--sidebar:#fff;--chat-bg:#e6ebee;--surface:#fff;--surface-2:#f1f3f5;--text:#1a1a1a;--text-secondary:#707579;--border:#e0e3e6;--accent:#3390ec;--accent-hover:#4ba3f0;--msg-self:#eeffde;--msg-other:#fff;--shadow:0 4px 20px rgba(0,0,0,.1)}
[data-theme="purple"]{--bg:#1a0f2e;--sidebar:#241638;--chat-bg:#160b28;--surface:#241638;--surface-2:#2e1f45;--text:#ede0ff;--text-secondary:#9d8ab8;--border:#1a0f2e;--accent:#9d4edd;--accent-hover:#b968f0;--msg-self:#6a1fb0;--msg-other:#2e1f45}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;transition:background .3s,color .3s}
input,textarea,button{font-family:inherit;font-size:16px}
.hidden{display:none!important}
.register-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
.register-box{background:var(--surface);padding:35px 25px;border-radius:20px;width:100%;max-width:400px;box-shadow:var(--shadow);text-align:center}
.register-box h1{margin-bottom:8px;font-size:24px}
.register-box p{color:var(--text-secondary);margin-bottom:20px;font-size:14px}
.register-box input{width:100%;padding:13px 16px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;outline:none}
.register-box button{width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.register-box .hint{font-size:12px;color:var(--text-secondary);margin-bottom:10px}
.error-msg{color:var(--danger);font-size:13px;margin-top:10px}
.sidebar{width:340px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.self-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:16px;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center;position:relative;border:2px solid var(--accent)}
.self-info{flex:1;overflow:hidden}
.self-info .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.self-info .id{font-size:12px;color:var(--text-secondary)}
.header-btn{background:transparent;border:none;color:var(--text-secondary);font-size:18px;padding:6px;border-radius:50%;cursor:pointer;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.header-btn:hover{background:var(--surface-2);color:var(--text)}
.header-btn.granted{color:var(--success)}
.header-btn.denied{color:var(--danger)}
.search-bar{padding:8px 14px;display:flex;gap:8px}
.search-bar input{flex:1;padding:10px 16px;background:var(--surface-2);border:none;border-radius:20px;color:var(--text);font-size:14px;outline:none}
.new-group-btn{background:var(--accent);border:none;border-radius:50%;width:40px;height:40px;color:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
.contact-list{flex:1;overflow-y:auto;padding:4px 8px}
.section-label{padding:12px 12px 6px;font-size:12px;color:var(--text-secondary);font-weight:600;letter-spacing:.5px}
.contact-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.15s;margin-bottom:2px}
.contact-item:hover{background:var(--surface-2)}
.contact-item.active{background:var(--accent);color:#fff}
.contact-item.active .contact-name,.contact-item.active .contact-preview{color:#fff!important}
.contact-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:18px;flex-shrink:0;position:relative;background-size:cover;background-position:center}
.online-dot{position:absolute;bottom:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--online);border:2px solid var(--sidebar)}
.contact-info{flex:1;overflow:hidden;min-width:0}
.contact-name{font-weight:600;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.contact-preview{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unread-badge{background:var(--unread);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600;min-width:20px;text-align:center}
.muted-icon{font-size:11px;opacity:.7}
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);min-width:0}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:15px;flex-direction:column;gap:15px;padding:30px;text-align:center}
.chat-header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-header .back-btn{display:none;background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px}
.chat-header-clickable{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.chat-header-clickable:hover{opacity:.85}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;background-size:cover;background-position:center;flex-shrink:0}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-status{font-size:12px;color:var(--text-secondary);margin-top:2px}
.chat-header-actions{display:flex;gap:2px}
.messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background-size:cover;background-position:center}
.message{max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;word-wrap:break-word;position:relative;animation:msgIn .2s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.self{align-self:flex-end;background:var(--msg-self);border-bottom-left-radius:3px}
.message.other{align-self:flex-start;background:var(--msg-other);border-bottom-right-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.message.system{align-self:center;background:transparent;color:var(--text-secondary);font-size:12px;padding:4px 12px;text-align:center}
.message .sender{font-size:12px;font-weight:600;margin-bottom:3px;color:var(--accent)}
.message .meta{font-size:10px;color:var(--text-secondary);text-align:left;margin-top:3px;opacity:.85;display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap}
.message.other .meta{justify-content:flex-start}
.message .media{max-width:100%;max-height:300px;border-radius:8px;margin-top:6px;cursor:pointer;display:block}
.message .file-link{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);padding:8px 12px;border-radius:8px;margin-top:6px;text-decoration:none;color:var(--accent);font-size:13px}
.message .reply-block{border-right:3px solid var(--accent);padding:4px 8px;margin-bottom:4px;font-size:12px;opacity:.85;background:rgba(0,0,0,.15);border-radius:4px}
.message .more-btn{background:transparent;border:none;color:var(--text-secondary);font-size:14px;cursor:pointer;padding:0 4px;opacity:.6}
.message .more-btn:hover{opacity:1;color:var(--accent)}
.message .pin-badge{background:var(--warning);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;margin-bottom:4px;display:inline-block}
.message .deleted{font-style:italic;opacity:.6}
.message.pinned{border:1px solid var(--warning)}
.message .text-content{margin-top:4px}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.reaction{background:var(--surface-2);padding:2px 8px;border-radius:12px;font-size:12px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:3px}
.reaction.mine{background:var(--accent);color:#fff}
.voice-msg{display:flex;align-items:center;gap:10px;padding:8px 4px;min-width:180px}
.voice-play{background:var(--accent);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;flex-shrink:0}
.voice-wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.voice-wave span{flex:1;background:var(--accent);border-radius:2px;opacity:.4}
.voice-time{font-size:11px;color:var(--text-secondary);flex-shrink:0}
.sticker-msg{font-size:64px;text-align:center;line-height:1.2;padding:4px}
.location-msg{display:flex;flex-direction:column;gap:6px;padding:4px}
.location-msg iframe{border:none;border-radius:8px;width:100%;height:180px}
.location-msg a{background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none;text-align:center;font-size:13px}
.reply-preview-bar{display:none;padding:8px 16px;background:var(--surface-2);border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary);align-items:center;justify-content:space-between}
.reply-preview-bar .close{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;font-size:18px}
.pin-bar{display:none;padding:8px 16px;background:var(--warning);color:#000;font-size:12px;align-items:center;justify-content:space-between}
.pin-bar .close{background:transparent;border:none;color:#000;cursor:pointer;font-size:16px}
.locked-bar{display:none;padding:10px 16px;background:var(--danger);color:#fff;font-size:13px;text-align:center}
.locked-bar.visible{display:block}
.input-area{padding:10px 12px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;padding-bottom:max(10px,env(safe-area-inset-bottom));position:relative}
.input-area input[type="text"]{flex:1;padding:11px 16px;background:var(--surface-2);border:none;border-radius:22px;color:var(--text);font-size:15px;outline:none;min-width:0;transition:flex .15s}
.input-area.typing .icon-btn:not(.send){display:none}
.icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.send{background:var(--accent);color:#fff}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.recording-bar{display:none;padding:12px 16px;background:var(--danger);color:#fff;align-items:center;gap:12px;justify-content:space-between}
.recording-bar.visible{display:flex}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.recording-bar button{background:rgba(255,255,255,.25);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px}
.sticker-panel{display:none;padding:12px;background:var(--surface);border-top:1px solid var(--border);max-height:220px;overflow-y:auto}
.sticker-panel.visible{display:block}
.sticker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sticker-grid button{background:transparent;border:none;font-size:36px;cursor:pointer;padding:6px;border-radius:8px;line-height:1}
.sticker-grid button:hover{background:var(--surface-2)}
#fileInput,#bgInput,#avatarInput,#groupAvatarInput{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow);position:relative;max-height:90vh;overflow-y:auto}
.modal-avatar{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#fff;margin:0 auto 16px;background-size:cover;background-position:center;position:relative;border:3px solid var(--accent)}
.modal-avatar.clickable{cursor:pointer}
.modal-avatar.clickable::after{content:'📷';position:absolute;bottom:0;right:0;background:var(--accent);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--surface)}
.avatar-actions{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.avatar-actions button{background:var(--surface-2);border:none;padding:8px 16px;border-radius:20px;color:var(--text);cursor:pointer;font-size:13px}
.avatar-actions button.danger{color:var(--danger)}
.modal h2{margin-bottom:16px;text-align:center}
.modal .modal-id{color:var(--text-secondary);font-size:14px;margin-bottom:6px;text-align:center}
.modal .modal-status{color:var(--online);font-size:13px;margin-bottom:16px;text-align:center}
.modal .modal-status.offline{color:var(--text-secondary)}
.modal .field{width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;outline:none;margin-bottom:12px;font-family:inherit}
.modal .field:focus{border-color:var(--accent)}
.modal .label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;margin-top:6px;display:block}
.modal .member-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:14px}
.modal .member-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.modal .member-item:hover{background:var(--surface-2)}
.modal .member-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer}
.modal .members-display{display:flex;flex-direction:column;gap:4px;margin:8px 0;max-height:180px;overflow-y:auto}
.modal .member-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.modal .member-row .m-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:12px;background-size:cover;background-position:center;flex-shrink:0}
.modal .member-row .m-info{flex:1;min-width:0}
.modal .member-row .m-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .member-row .m-id{font-size:11px;color:var(--text-secondary)}
.modal .member-row .m-badge{font-size:10px;padding:2px 6px;border-radius:8px;background:var(--accent);color:#fff}
.modal button.primary{width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.modal button.primary:hover{background:var(--accent-hover)}
.modal button.danger{background:var(--danger)}
.modal button.danger:hover{background:#c0392b}
.modal .close-btn{position:absolute;top:12px;left:12px;background:transparent;border:none;color:var(--text-secondary);font-size:24px;cursor:pointer}
.emoji-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;max-height:240px;overflow-y:auto}
.emoji-picker span{font-size:22px;cursor:pointer;padding:4px;border-radius:6px;text-align:center}
.emoji-picker span:hover{background:var(--surface-2)}
.msg-menu{position:fixed;background:var(--surface);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);padding:6px;z-index:9999;min-width:160px}
.msg-menu button{display:block;width:100%;padding:10px 14px;background:transparent;border:none;color:var(--text);text-align:right;font-size:14px;cursor:pointer;border-radius:8px;font-family:inherit}
.msg-menu button:hover{background:var(--surface-2)}
.msg-menu button.danger{color:var(--danger)}
.theme-selector{display:flex;gap:10px;justify-content:center;margin:12px 0}
.theme-swatch{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.theme-swatch.active{border-color:var(--text)}
.theme-swatch.dark{background:#0f1419}
.theme-swatch.light{background:#f0f2f5}
.theme-swatch.purple{background:#241638}
.color-input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.color-input-row label{font-size:13px;min-width:90px;color:var(--text-secondary)}
.color-input-row input[type="color"]{width:60px;height:36px;border:none;border-radius:8px;cursor:pointer;background:transparent}
.search-overlay{position:fixed;inset:0;background:var(--bg);z-index:800;display:none;flex-direction:column}
.search-overlay.open{display:flex}
.search-overlay .header{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.search-overlay input{flex:1;padding:10px 14px;background:var(--surface-2);border:none;border-radius:20px;color:var(--text);outline:none;font-family:inherit}
.search-overlay .results{flex:1;overflow-y:auto;padding:10px}
.search-result{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.search-result:hover{background:var(--surface-2)}
@media(max-width:700px){
  .sidebar{width:100%;position:fixed;inset:0;z-index:10}
  .chat-main{position:fixed;inset:0;z-index:20;display:none}
  .chat-main.open{display:flex}
  .chat-header .back-btn{display:block}
  .message{max-width:85%}
}
</style>
</head>
<body>

<input type="file" id="avatarInput" accept="image/*">
<input type="file" id="bgInput" accept="image/*">
<input type="file" id="groupAvatarInput" accept="image/*">

<div class="register-screen" id="registerScreen">
  <div class="register-box">
    <h1>👋 خوش آمدید</h1>
    <p>یک شناسه و نام برای خود انتخاب کنید</p>
    <input type="text" id="regId" placeholder="شناسه (ali_2025)" maxlength="20" autocomplete="off">
    <div class="hint">شناسه باید یکتا و انگلیسی باشد (۳-۲۰ کاراکتر)</div>
    <input type="text" id="regName" placeholder="نام نمایشی" maxlength="30">
    <button onclick="registerUser()">ورود به چت</button>
    <div class="error-msg hidden" id="regError"></div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="self-avatar" id="selfAvatar" onclick="showMyProfile()">?</div>
    <div class="self-info">
      <div class="name" id="selfName">...</div>
      <div class="id" id="selfId">...</div>
    </div>
    <button class="header-btn" id="notifBtn" onclick="toggleNotifications()" title="اعلان">🔕</button>
    <button class="header-btn" onclick="toggleTheme()" title="تم">🌓</button>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="جستجو...">
    <button class="new-group-btn" onclick="showCreateGroup()" title="گروه جدید">+</button>
  </div>
  <div class="contact-list" id="contactList"></div>
</div>

<div class="chat-main" id="chatMain">
  <div class="chat-empty" id="chatEmpty">
    <div style="font-size:64px;opacity:.4">💬</div>
    <div>یک مخاطب یا گروه را انتخاب کنید</div>
  </div>
  <div class="hidden" id="chatView" style="display:none;flex-direction:column;height:100%">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChatMobile()">→</button>
      <div class="chat-header-clickable" onclick="openChatProfile()">
        <div class="chat-header-avatar" id="chatAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatName">...</div>
          <div class="chat-header-status" id="chatStatus">...</div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" onclick="openSearch()" title="جستجو">🔍</button>
        <button class="icon-btn" onclick="showChatSettings()" title="تنظیمات">⚙️</button>
      </div>
    </div>
    <div class="pin-bar" id="pinBar">
      <span id="pinText"></span>
      <button class="close" onclick="hidePinBar()">×</button>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="locked-bar" id="lockedBar">🔒 ارسال پیام توسط ادمین بسته شده است</div>
    <div class="reply-preview-bar" id="replyPreviewBar">
      <span id="replyPreviewText"></span>
      <button class="close" onclick="cancelReply()">×</button>
    </div>
    <div class="recording-bar" id="recordingBar">
      <span class="rec-dot"></span>
      <span id="recTime">0:00</span>
      <span style="flex:1">در حال ضبط... (متن هم می‌توانی بنویسی)</span>
      <button onclick="cancelRecording()">لغو</button>
      <button onclick="stopRecording()">ارسال</button>
    </div>

function cacheAppend(r,m){const a=cacheGet(r);if(!a.find(x=>String(x.id)===String(m.id))){a.push(m);cacheSet(r,a)}}
function cacheUpdate(r,id,changes){const a=cacheGet(r);const i=a.findIndex(x=>String(x.id)===String(id));if(i!==-1){a[i]={...a[i],...changes};cacheSet(r,a)}}

async function loadGroups(){

  const {data}=await sb.from('rooms').select('*').in('id',m.map(x=>x.room_id));
  userGroups=data||[];refreshContactList();
}

async function computeUnread(){
  const {data:st}=await sb.from('user_read_status').select('*').eq('user_id',currentUser.id);
  const rm={};(st||[]).forEach(s=>rm[s.room_id]=s.last_read_at);
  const c={};
  const {data:pr}=await sb.from('offline_messages').select('room_id,sender_id,created_at').like('room_id','private:%');
  (pr||[]).forEach(m=>{
    if(m.sender_id===currentUser.id||!m.room_id.includes(currentUser.id))return;
    const lr=rm[m.room_id];
    if(!lr||new Date(m.created_at)>new Date(lr))c[m.room_id]=(c[m.room_id]||0)+1;
  });
  for(const g of userGroups){
    const lr=rm[g.id];
    let q=sb.from('group_messages').select('*',{count:'exact',head:true}).eq('room_id',g.id).neq('sender_id',currentUser.id);
    if(lr)q=q.gt('created_at',lr);
    const {count}=await q;
    if(count>0)c[g.id]=count;
  }
  unreadCounts=c;
}

function refreshContactList(){
  const list=$('contactList');
  const search=$('searchInput').value.toLowerCase();
  list.innerHTML='';
  if(userGroups.length>0){
    const lb=document.createElement('div');lb.className='section-label';lb.textContent='گروه‌ها';list.appendChild(lb);
    userGroups.filter(g=>!search||g.name.toLowerCase().includes(search)).forEach(g=>{
      list.appendChild(buildItem({type:'group',id:g.id,name:g.name,emoji:g.avatar_emoji||'👥',avatarUrl:g.avatar_url,unread:unreadCounts[g.id]||0,muted:mutedRooms.has(g.id)}));
    });
  }
  const lb2=document.createElement('div');lb2.className='section-label';lb2.textContent='مخاطبین';list.appendChild(lb2);
  allProfiles.filter(p=>!search||p.display_name.toLowerCase().includes(search)||p.id.includes(search)).forEach(p=>{
    const rid=privateRoomId(currentUser.id,p.id);
    list.appendChild(buildItem({type:'private',id:p.id,name:p.display_name,online:onlineUsers.has(p.id),unread:unreadCounts[rid]||0,avatarUrl:p.avatar_url,avatarId:p.id,status:p.status_emoji}));
  });
}

function buildItem({type,id,name,emoji,online,unread,avatarUrl,avatarId,muted,status}){
  const el=document.createElement('div');el.className='contact-item';
  if(currentChat&&currentChat.type===type&&currentChat.id===id)el.classList.add('active');
  const av=document.createElement('div');av.className='contact-avatar';
  if(avatarUrl){av.style.backgroundImage=`url('${avatarUrl}')`}
  else{av.textContent=emoji||initials(name);av.style.background=type==='group'?'#8b5cf6':colorFor(avatarId||id)}
  if(type==='private'&&online){const d=document.createElement('div');d.className='online-dot';av.appendChild(d)}
  const info=document.createElement('div');info.className='contact-info';
  const preview=type==='group'?(muted?'گروه (بی‌صدا)':'گروه'):(online?'آنلاین':'آفلاین');
  const nameHtml=`<div class="contact-name">${status?status+' ':''}${esc(name)}${muted?' <span class="muted-icon">🔕</span>':''}</div>`;
  info.innerHTML=nameHtml+`<div class="contact-preview">${preview}</div>`;
  const meta=document.createElement('div');meta.className='contact-meta';
  if(unread>0&&!muted)meta.innerHTML=`<div class="unread-badge">${unread>99?'99+':unread}</div>`;
  el.appendChild(av);el.appendChild(info);el.appendChild(meta);
  el.onclick=()=>{type==='private'?openPrivateChat(id):openGroup(id)};
  return el;
}

function openChatProfile(){
  if(!currentChat)return;
  if(currentChat.type==='private')showProfile(currentChat.id);

function showProfile(userId){
  const p=allProfiles.find(x=>x.id===userId);if(!p)return;
  const o=onlineUsers.has(p.id);
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  const avHtml=p.avatar_url?`<div class="modal-avatar" style="background-image:url('${p.avatar_url}')"></div>`:`<div class="modal-avatar" style="background:${colorFor(p.id)}">${initials(p.display_name)}</div>`;
  ov.innerHTML=`<div class="modal">
    <button class="close-btn" onclick="this.parentElement.parentElement.remove()">×</button>
    ${avHtml}
    <h2>${p.status_emoji||''} ${esc(p.display_name)}</h2>
    <div class="modal-id">@${esc(p.id)}</div>
    ${p.phone?`<div style="text-align:center;font-size:13px;color:var(--accent);margin-bottom:8px">📞 ${esc(p.phone)}</div>`:''}
    ${p.bio?`<div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:12px;padding:0 16px">${esc(p.bio)}</div>`:''}
    <div class="modal-status ${o?'':'offline'}">${o?'🟢 آنلاین':lastSeenText(p.last_seen)}</div>
    <button class="primary" onclick="this.parentElement.parentElement.remove();openPrivateChat('${p.id}')">شروع گفتگو</button>
  </div>`;
  document.body.appendChild(ov);
}

async function showGroupProfile(){
  if(!currentChat||currentChat.type!=='group')return;
  const g=currentChat.group;
  const {data:members}=await sb.from('room_members').select('*').eq('room_id',currentChat.id);
  const {data:profiles}=await sb.from('profiles').select('*');
  const {data:settings}=await sb.from('room_settings').select('*').eq('room_id',currentChat.id).maybeSingle();
  currentGroupMembers=(members||[]).map(m=>{
    const p=(profiles||[]).find(x=>x.id===m.user_id);
    return p?{...p,is_creator:g.created_by===p.id}:null;
  }).filter(Boolean);
  currentGroupLocked=settings?.is_locked||false;

  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  const avHtml=g.avatar_url?`<div class="modal-avatar clickable" style="background-image:url('${g.avatar_url}')" onclick="triggerGroupAvatarUpload('${g.id}')"></div>`:`<div class="modal-avatar clickable" style="background:#8b5cf6" onclick="triggerGroupAvatarUpload('${g.id}')">${g.avatar_emoji||'👥'}</div>`;
  const membersHtml=currentGroupMembers.map(m=>{
    const av=m.avatar_url?`<div class="m-av" style="background-image:url('${m.avatar_url}')"></div>`:`<div class="m-av" style="background:${colorFor(m.id)}">${initials(m.display_name)}</div>`;
    return `<div class="member-row">${av}<div class="m-info"><div class="m-name">${esc(m.display_name)}</div><div class="m-id">@${esc(m.id)}</div></div>${m.is_creator?'<span class="m-badge">سازنده</span>':''}${onlineUsers.has(m.id)?'<span style="color:var(--success);font-size:11px">🟢</span>':''}</div>`;
  }).join('');
  ov.innerHTML=`<div class="modal">
    <button class="close-btn" onclick="this.parentElement.parentElement.remove()">×</button>
    ${avHtml}
    <h2>${g.avatar_emoji||'👥'} ${esc(g.name)}</h2>
    ${g.bio?`<div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:8px;padding:0 16px">${esc(g.bio)}</div>`:''}
    <div class="modal-status">${currentGroupMembers.length} عضو</div>
    <label class="label" style="text-align:right">ویرایش نام گروه</label>
    <input type="text" class="field" id="gpName" value="${esc(g.name)}" maxlength="40">
    <label class="label" style="text-align:right">ویرایش بیو</label>
    <textarea class="field" id="gpBio" rows="2" maxlength="150">${esc(g.bio||'')}</textarea>
    <label class="label" style="text-align:right">ایموجی گروه</label>
    <input type="text" class="field" id="gpEmoji" value="${esc(g.avatar_emoji||'👥')}" maxlength="2">
    <button class="primary" onclick="saveGroupInfoFromProfile()">💾 ذخیره تغییرات گروه</button>
    ${g.avatar_url?`<button class="primary danger" onclick="removeGroupAvatar('${g.id}')" style="margin-top:8px">🗑️ حذف عکس گروه</button>`:''}
    <h3 style="margin:16px 0 8px;font-size:15px;text-align:right">👥 اعضا (${currentGroupMembers.length})</h3>
    <div class="members-display">${membersHtml||'<div style="color:var(--text-secondary);text-align:center;padding:10px">عضوی نیست</div>'}</div>
    ${g.created_by===currentUser.id?`<button class="primary danger" onclick="deleteGroupByCreator()" style="margin-top:12px">🗑️ حذف گروه</button>`:''}
  </div>`;
  document.body.appendChild(ov);
}

async function saveGroupInfoFromProfile(){
  const name=$('gpName').value.trim();
  const bio=$('gpBio').value.trim();
  const emoji=$('gpEmoji').value.trim()||'👥';
  if(!name){alert('نام خالی');return}
  const {error}=await sb.from('rooms').update({name,bio:bio||null,avatar_emoji:emoji}).eq('id',currentChat.id);
  if(error){alert('خطا: '+error.message);return}
  await loadGroups();
  currentChat.name=name;currentChat.group.name=name;currentChat.group.bio=bio;currentChat.group.avatar_emoji=emoji;
  $('chatName').textContent=name;
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  showGroupProfile();
}

async function deleteGroupByCreator(){
  if(!confirm('گروه و همه پیام‌هایش حذف شوند؟'))return;
  await sb.from('group_messages').delete().eq('room_id',currentChat.id);
  await sb.from('room_members').delete().eq('room_id',currentChat.id);
  await sb.from('muted_rooms').delete().eq('room_id',currentChat.id);
  await sb.from('room_invites').delete().eq('room_id',currentChat.id);
  await sb.from('room_settings').delete().eq('room_id',currentChat.id);
  await sb.from('rooms').delete().eq('id',currentChat.id);
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  closeChatMobile();
  await loadGroups();
}

function triggerGroupAvatarUpload(groupId){
  groupAvatarTarget=groupId;
  $('groupAvatarInput').click();
}

async function uploadGroupAvatar(groupId,file){
  if(!file.type.startsWith('image/')){alert('فقط عکس');return}
  if(file.size>5*1024*1024){alert('حداکثر ۵MB');return}
  const path=`groups/${groupId}.${file.name.split('.').pop()}`;
  const {error}=await sb.storage.from('chat-media').upload(path,file,{upsert:true});
  if(error){alert('خطا: '+error.message);return}
  const {data:u}=sb.storage.from('chat-media').getPublicUrl(path);
  await sb.from('rooms').update({avatar_url:u.publicUrl}).eq('id',groupId);
  await loadGroups();
  if(currentChat&&currentChat.id===groupId){
    currentChat.group.avatar_url=u.publicUrl;
    $('chatAvatar').style.backgroundImage=`url('${u.publicUrl}')`;
    $('chatAvatar').textContent='';
  }
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  showGroupProfile();
}

async function removeGroupAvatar(groupId){
  if(!confirm('عکس گروه حذف شود؟'))return;
  const {data:g}=await sb.from('rooms').select('avatar_url').eq('id',groupId).maybeSingle();
  if(g&&g.avatar_url){
    const path=g.avatar_url.split('/chat-media/')[1];
    if(path)await sb.storage.from('chat-media').remove([path]).catch(()=>{});
  }
  await sb.from('rooms').update({avatar_url:null}).eq('id',groupId);
  await loadGroups();
  if(currentChat&&currentChat.id===groupId){
    currentChat.group.avatar_url=null;
    $('chatAvatar').style.backgroundImage='';
    $('chatAvatar').textContent=currentChat.group.avatar_emoji||'👥';
  }
  document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
  showGroupProfile();
}

async function checkGroupLock(){
  if(!currentChat||currentChat.type!=='group')return;
  const {data}=await sb.from('room_settings').select('is_locked').eq('room_id',currentChat.id).maybeSingle();
  currentGroupLocked=data?.is_locked||false;
  $('lockedBar').classList.toggle('visible',currentGroupLocked);
  $('messageInput').disabled=currentGroupLocked;
  $('sendBtn').disabled=currentGroupLocked;
}

async function openPrivateChat(otherId){
  const p=allProfiles.find(x=>x.id===otherId);if(!p)return;
  if(currentChannel){await sb.removeChannel(currentChannel);currentChannel=null}
  currentChat={type:'private',id:otherId,roomId:privateRoomId(currentUser.id,otherId),name:p.display_name,muted:mutedRooms.has(privateRoomId(currentUser.id,otherId))};
  hidePinBar();
  $('lockedBar').classList.remove('visible');
  showChatView(p.display_name,onlineUsers.has(otherId)?'🟢 آنلاین':lastSeenText(p.last_seen),p.avatar_url,colorFor(p.id));
  $('messagesArea').innerHTML='';
  $('chatMain').classList.add('open');
  applyBackground(currentUser.chat_background_url);
  cacheGet(currentChat.roomId).forEach(m=>renderMessage(m,currentChat.roomId));
  await loadOfflineMessages(currentChat.roomId);
  await markAsRead(currentChat.roomId);
  currentChannel=sb.channel('chat:'+currentChat.roomId,{config:{broadcast:{self:true},presence:{key:currentUser.id}}});
  currentChannel.on('broadcast',{event:'msg'},({payload})=>handleIncomingMessage(payload,currentChat.roomId));
  currentChannel.on('broadcast',{event:'reaction'},({payload})=>{
    cacheUpdate(currentChat.roomId,payload.msgId,{reactions:payload.reactions});
    const el=document.querySelector(`.message[data-id="${payload.msgId}"] .reactions`);
    if(el)el.outerHTML=renderReactions(payload.reactions,currentUser.id,payload.msgId);
  });
  currentChannel.on('broadcast',{event:'delete'},({payload})=>{
    const el=document.querySelector(`.message[data-id="${payload.msgId}"]`);
    if(el)el.innerHTML='<div class="deleted">🚫 این پیام حذف شد</div>';
    cacheUpdate(currentChat.roomId,payload.msgId,{deleted_for_all:true});
  });
  currentChannel.on('presence',{event:'sync'},()=>{
    const o=Object.keys(currentChannel.presenceState()).filter(k=>k!==currentUser.id);
    $('chatStatus').textContent=o.length>0?'🟢 آنلاین':lastSeenText(p.last_seen);
  });
  currentChannel.subscribe(async s=>{
    if(s==='SUBSCRIBED'){
      await currentChannel.track({user_id:currentUser.id});
      $('messageInput').disabled=false;$('sendBtn').disabled=false;
      $('messageInput').focus();
    }
  });
  refreshContactList();
}

async function loadOfflineMessages(rid){
  const {data}=await sb.from('offline_messages').select('*').eq('room_id',rid).neq('sender_id',currentUser.id).order('created_at');
  if(!data||data.length===0)return;
  data.forEach(m=>renderMessage({...m,id:'offline-'+m.id},rid));
  await sb.from('offline_messages').delete().in('id',data.map(m=>m.id));
  await computeUnread();
}

async function openGroup(rid){
  const g=userGroups.find(x=>x.id===rid);if(!g)return;
  if(currentChannel){await sb.removeChannel(currentChannel);currentChannel=null}
  currentChat={type:'group',id:rid,roomId:rid,name:g.name,muted:mutedRooms.has(rid),created_by:g.created_by,group:g};
  showChatView(g.name,'گروه',g.avatar_url,'#8b5cf6',g.avatar_emoji||'👥');
  $('messagesArea').innerHTML='';
  $('chatMain').classList.add('open');
  applyBackground(currentUser.chat_background_url);
  const cached=cacheGet(rid);
  cached.forEach(m=>renderMessage(m,rid));
  await markAsRead(rid);
  await checkGroupLock();
  const {data}=await sb.from('group_messages').select('*').eq('room_id',rid).order('created_at').limit(200);
  const seen=new Set(cached.map(m=>String(m.id)));
  (data||[]).forEach(m=>{if(!seen.has(String(m.id))){renderMessage(m,rid);cacheAppend(rid,m)}});
  const pinned=(data||[]).find(m=>m.is_pinned);
  if(pinned){pinnedMessage=pinned;showPinBar(pinned)}
  currentChannel=sb.channel('group:'+rid);
  currentChannel.on('postgres_changes',{event:'INSERT',schema:'public',table:'group_messages',filter:'room_id=eq.'+rid},p=>{
    if(p.new.sender_id===currentUser.id)return;
    renderMessage(p.new,rid);cacheAppend(rid,p.new);
  });
  currentChannel.on('postgres_changes',{event:'UPDATE',schema:'public',table:'group_messages',filter:'room_id=eq.'+rid},p=>{
    const el=document.querySelector(`.message[data-id="${p.new.id}"]`);
    if(el){el.remove();cacheUpdate(rid,p.new.id,p.new);renderMessage(p.new,rid)}
    if(p.new.is_pinned){pinnedMessage=p.new;showPinBar(p.new)}
    else if(pinnedMessage&&pinnedMessage.id===p.new.id){hidePinBar();pinnedMessage=null}
  });
  currentChannel.on('postgres_changes',{event:'DELETE',schema:'public',table:'group_messages',filter:'room_id=eq.'+rid},p=>{
    const el=document.querySelector(`.message[data-id="${p.old.id}"]`);
    if(el)el.remove();
  });
  currentChannel.subscribe(s=>{
    if(s==='SUBSCRIBED'){
      $('messageInput').disabled=currentGroupLocked;
      $('sendBtn').disabled=currentGroupLocked;
      $('messageInput').focus();
    }
  });
  refreshContactList();
}

function showPinBar(msg){$('pinBar').style.display='flex';$('pinText').textContent='📌 '+esc(msg.sender_name)+': '+esc((msg.content||'').slice(0,40))}
function hidePinBar(){$('pinBar').style.display='none'}

function showChatView(name,status,avatarUrl,bgColor,emoji){
  $('chatEmpty').classList.add('hidden');
  const cv=$('chatView');cv.classList.remove('hidden');cv.style.display='flex';
  $('chatName').textContent=name;
  $('chatStatus').textContent=status;
  const av=$('chatAvatar');
  if(avatarUrl){av.style.backgroundImage=`url('${avatarUrl}')`;av.textContent=''}
  else{av.style.background=bgColor||'var(--accent)';av.textContent=emoji||initials(name)}
  $('messageInput').disabled=true;$('sendBtn').disabled=true;
  $('stickerPanel').classList.remove('visible');
  $('messageInput').value='';
  $('inputArea').classList.remove('typing');
}

function updateChatHeaderStatus(){
  if(!currentChat||currentChat.type!=='private')return;
  const p=allProfiles.find(x=>x.id===currentChat.id);
  $('chatStatus').textContent=onlineUsers.has(currentChat.id)?'🟢 آنلاین':(p?lastSeenText(p.last_seen):'آفلاین');
}

function renderReactions(reactions,myId,msgId){
  if(!reactions||Object.keys(reactions).length===0)return '<div class="reactions"></div>';
  const html=Object.entries(reactions).map(([emoji,users])=>{
    const arr=Array.isArray(users)?users:[];
    const mine=arr.includes(myId);
    return `<span class="reaction${mine?' mine':''}" onclick="toggleReaction('${msgId}','${emoji}')">${emoji} ${arr.length}</span>`;
  }).join('');
  return `<div class="reactions">${html}</div>`;
}

function renderMessage(msg,rid){
  const area=$('messagesArea');
  const self=msg.sender_id===currentUser.id;
  const div=document.createElement('div');
  div.className='message '+(self?'self':'other');
  if(msg.is_pinned)div.classList.add('pinned');
  div.dataset.id=msg.id;
  if(msg.deleted_for_all){
    div.innerHTML='<div class="deleted">🚫 این پیام حذف شد</div>';
    area.appendChild(div);area.scrollTop=area.scrollHeight;return;
  }
  let html='';
  if(!self&&currentChat?.type==='group')html+=`<div class="sender">${esc(msg.sender_name)}</div>`;
  if(msg.is_pinned)html+='<div class="pin-badge">📌 پین</div>';
  if(msg.reply_to_id){
    const r=cacheGet(rid).find(m=>String(m.id)===String(msg.reply_to_id));
    if(r)html+=`<div class="reply-block">↩️ ${esc(r.sender_name)}: ${esc((r.content||'').slice(0,50))}</div>`;
  }
  // media اول (ویس/عکس/ویدیو)
  if(msg.media_url){
    const mt=msg.media_type||'';
    if(mt.startsWith('audio/')){
      const dur=msg.media_duration||0;
      html+=`<div class="voice-msg"><button class="voice-play" onclick="playVoice(this,'${msg.media_url}')">▶</button><div class="voice-wave">${Array(20).fill(0).map(()=>`<span style="height:${4+Math.random()*20}px"></span>`).join('')}</div><span class="voice-time">${formatDuration(dur)}</span></div>`;
    } else if(mt.startsWith('image/')||/\.(jpg|jpeg|png|gif|webp)$/i.test(msg.media_url)){
      html+=`<img class="media" src="${msg.media_url}" onclick="window.open('${msg.media_url}','_blank')">`;
    } else if(mt.startsWith('video/')||/\.(mp4|webm|mov)$/i.test(msg.media_url)){
      html+=`<video class="media" controls src="${msg.media_url}"></video>`;
    } else {
      html+=`<a class="file-link" href="${msg.media_url}" target="_blank">📎 دانلود فایل</a>`;
    }
  }
  if(msg.media_type==='location'&&msg.media_lat&&msg.media_lng){
    const lat=msg.media_lat,lng=msg.media_lng;
    html+=`<div class="location-msg"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.005},${lat-0.005},${lng+0.005},${lat+0.005}&marker=${lat},${lng}" loading="lazy"></iframe><a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}" target="_blank">🗺️ مشاهده در نقشه</a></div>`;
  }
  // متن پیام — زیر مدیا نمایش داده می‌شود (مخصوصاً برای ویس)
  if(msg.content){
    if(msg.content.startsWith('[[STICKER]]'))html+=`<div class="sticker-msg">${msg.content.replace('[[STICKER]]','')}</div>`;
    else html+=`<div class="text-content">${esc(msg.content)}</div>`;
  }
  html+=renderReactions(msg.reactions,currentUser.id,msg.id);
  html+=`<div class="meta"><span>${fmtTime(msg.created_at)}</span><button class="more-btn" onclick="showMsgMenu(event,'${msg.id}','${msg.sender_id}')">⋯</button></div>`;
  div.innerHTML=html;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function playVoice(btn,url){
  const audio=new Audio(url);audio.play();btn.textContent='⏸';
  btn.onclick=()=>{if(audio.paused){audio.play();btn.textContent='⏸'}else{audio.pause();btn.textContent='▶'}};
  audio.onended=()=>{btn.textContent='▶';btn.onclick=()=>playVoice(btn,url)};
}

function showMsgMenu(e,msgId,senderId){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.msg-menu').forEach(m=>m.remove());
  const msg=cacheGet(currentChat.roomId).find(m=>String(m.id)===String(msgId));
  if(!msg)return;
  const isMine=senderId===currentUser.id;
  const canDelete=isMine&&(Date.now()-new Date(msg.created_at).getTime()<2*60*60*1000);
  const menu=document.createElement('div');
  menu.className='msg-menu';
  menu.style.top=Math.min(e.clientY,window.innerHeight-300)+'px';
  menu.style.left=Math.max(10,Math.min(e.clientX-80,window.innerWidth-180))+'px';
  let html=`<div style="padding:8px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:4px">`;
  REACTIONS.forEach(r=>{html+=`<button style="width:auto;padding:4px 8px;font-size:20px" onclick="toggleReaction('${msgId}','${r}');event.stopPropagation();document.querySelectorAll('.msg-menu').forEach(m=>m.remove())">${r}</button>`});
  html+=`</div>`;
  html+=`<button onclick="setReply('${msgId}');this.parentElement.remove()">↩️ پاسخ</button>`;
  if(isMine)html+=`<button onclick="editMessage('${msgId}');this.parentElement.remove()">✏️ ویرایش</button>`;
  if(canDelete)html+=`<button class="danger" onclick="deleteForAll('${msgId}');this.parentElement.remove()">🗑️ حذف برای همه</button>`;
  if(currentChat?.type==='group')html+=`<button onclick="togglePin('${msgId}');this.parentElement.remove()">📌 ${msg.is_pinned?'برداشتن پین':'پین'}</button>`;
  html+=`<button class="danger" onclick="reportMessage('${msgId}');this.parentElement.remove()">🚨 گزارش تخلف</button>`;
  menu.innerHTML=html;
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),100);
}

async function toggleReaction(msgId,emoji){
  const msg=cacheGet(currentChat.roomId).find(m=>String(m.id)===String(msgId));
  if(!msg)return;
  const reactions={...msg.reactions||{}};
  const arr=reactions[emoji]||[];
  const idx=arr.indexOf(currentUser.id);
  if(idx>-1)arr.splice(idx,1);else arr.push(currentUser.id);
  if(arr.length===0)delete reactions[emoji];else reactions[emoji]=arr;
  if(currentChat.type==='private'&&currentChannel)currentChannel.send({type:'broadcast',event:'reaction',payload:{msgId,reactions}});
  else if(currentChat.type==='group'&&String(msg.id).match(/^\d+$/))await sb.from('group_messages').update({reactions}).eq('id',msg.id);
  cacheUpdate(currentChat.roomId,msgId,{reactions});
  const el=document.querySelector(`.message[data-id="${msgId}"] .reactions`);
  if(el)el.outerHTML=renderReactions(reactions,currentUser.id,msgId);
}

function setReply(mid){
  const m=cacheGet(currentChat.roomId).find(x=>String(x.id)===String(mid));
  if(!m)return;replyTarget=m;editTarget=null;
  $('replyPreviewBar').style.display='flex';
  $('replyPreviewText').textContent=`↩️ ${m.sender_name}: ${(m.content||'').slice(0,40)}...`;
}
function cancelReply(){replyTarget=null;editTarget=null;$('replyPreviewBar').style.display='none'}

function editMessage(mid){
  const m=cacheGet(currentChat.roomId).find(x=>String(x.id)===String(mid));
  if(!m)return;
  $('messageInput').value=m.content||'';
  editTarget=m;replyTarget=null;
  $('replyPreviewBar').style.display='flex';
  $('replyPreviewText').textContent='✏️ حالت ویرایش';
  $('messageInput').focus();
  $('inputArea').classList.toggle('typing',$('messageInput').value.trim().length>0);
}

async function deleteForAll(mid){
  if(!confirm('پیام برای همه حذف شود؟'))return;
  if(currentChat.type==='private'&&currentChannel)currentChannel.send({type:'broadcast',event:'delete',payload:{msgId:mid}});
  else if(currentChat.type==='group'&&String(mid).match(/^\d+$/))await sb.from('group_messages').update({deleted_for_all:true}).eq('id',mid);
  const el=document.querySelector(`.message[data-id="${mid}"]`);
  if(el)el.innerHTML='<div class="deleted">🚫 این پیام حذف شد</div>';

async function sendMessage(){

    else if(currentChat.type==='group'&&String(editTarget.id).match(/^\d+$/))await sb.from('group_messages').update({content:text}).eq('id',editTarget.id);
    cacheUpdate(currentChat.roomId,editTarget.id,{content:text});

    $('inputArea').classList.remove('typing');
    $('messagesArea').innerHTML='';cacheGet(currentChat.roomId).forEach(m=>renderMessage(m,currentChat.roomId));

  if(currentChat.type==='group'&&currentGroupLocked){alert('ارسال پیام در این گروه توسط ادمین بسته شده');return}

}

async function sendPrivateMessage(msg){

    const payload={...msg,id:'bc-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)};
    await currentChannel.send({type:'broadcast',event:'msg',payload});
    renderMessage(payload,currentChat.roomId);cacheAppend(currentChat.roomId,payload);
  } else {
    const {data,error}=await sb.from('offline_messages').insert({room_id:currentChat.roomId,sender_id:msg.sender_id,sender_name:msg.sender_name,content:msg.content,media_url:msg.media_url,media_type:msg.media_type,media_duration:msg.media_duration,media_lat:msg.media_lat,media_lng:msg.media_lng}).select().single();
    if(!error&&data){const d={...msg,id:'sent-'+data.id};renderMessage(d,currentChat.roomId);cacheAppend(currentChat.roomId,d)}
  }
}

async function sendGroupMessage(msg){

  const p={room_id:currentChat.roomId,sender_id:msg.sender_id,sender_name:msg.sender_name,content:msg.content,media_url:msg.media_url,media_type:msg.media_type,media_duration:msg.media_duration,media_lat:msg.media_lat,media_lng:msg.media_lng};

}

async function startRecording(){
  if(!currentChat)return;
  if(currentChat.type==='group'&&currentGroupLocked){alert('ارسال بسته است');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);recordedChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(recTimer);$('recordingBar').classList.remove('visible');
      const blob=new Blob(recordedChunks,{type:'audio/webm'});
      const duration=Math.round((Date.now()-recordStartTime)/1000);
      if(blob.size<1000||duration<1)return;
      await sendVoiceBlob(blob,duration);
    };
    mediaRecorder.start();recordStartTime=Date.now();
    $('recordingBar').classList.add('visible');$('recTime').textContent='0:00';
    recTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recordStartTime)/1000);
      $('recTime').textContent=formatDuration(s);
      if(s>=120)stopRecording();
    },500);
  }catch(e){alert('میکروفون: '+e.message)}
}

function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop()}
function cancelRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.onstop=null;mediaRecorder.stop();if(mediaRecorder.stream)mediaRecorder.stream.getTracks().forEach(t=>t.stop())}
  clearInterval(recTimer);$('recordingBar').classList.remove('visible');recordedChunks=[];
}

  else{btn.textContent='🔕';btn.title='اعلان خاموش (کلیک=روشن)'}

  else if(Notification.permission==='denied'){alert('اعلان‌ها مسدود است. از تنظیمات مرورگر اجازه بده.')}
  else{const perm=await Notification.requestPermission();if(perm==='granted'){notificationsEnabled=true;updateNotifButton();try{new Notification('✅ اعلان‌ها فعال شد')}catch(e){}}}
}

    n.onclick=()=>{window.focus();if(onclick)onclick();n.close()};
  }catch(e){}
}

function closeChatMobile(){
  $('chatMain').classList.remove('open');
  if(currentChannel){sb.removeChannel(currentChannel);currentChannel=null}
  currentChat=null;cancelReply();hidePinBar();
  $('lockedBar').classList.remove('visible');
  $('messageInput').value='';
  $('inputArea').classList.remove('typing');
}

init();
</script>
