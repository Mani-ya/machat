<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پنل ادمین</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Tahoma, sans-serif; background: #0f1419; color: #e1e8f0; padding: 20px; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; }
.login-box { background: #17212b; padding: 40px 30px; border-radius: 16px; max-width: 400px; margin: 80px auto; text-align: center; }
.login-box input { width: 100%; padding: 14px; margin-bottom: 12px; background: #1c2733; border: 1px solid #2a3542; border-radius: 10px; color: white; font-family: inherit; font-size: 15px; outline: none; }
.login-box button, .btn { padding: 12px 24px; background: #5288c1; border: none; border-radius: 10px; color: white; font-family: inherit; font-size: 14px; cursor: pointer; transition: 0.2s; }
.login-box button:hover, .btn:hover { background: #6ba0d3; }
.btn.danger { background: #e74c3c; } .btn.danger:hover { background: #c0392b; }
.btn.success { background: #10b981; } .btn.success:hover { background: #059669; }
.hidden { display: none !important; }
h1 { margin-bottom: 20px; font-size: 22px; }
h2 { margin: 25px 0 15px; font-size: 17px; color: #a0b0c0; }
.card { background: #17212b; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
.row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.row input, .row select { flex: 1; min-width: 150px; padding: 10px 14px; background: #1c2733; border: 1px solid #2a3542; border-radius: 8px; color: white; font-family: inherit; font-size: 14px; outline: none; }
.item { background: #1c2733; padding: 14px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.tag { display: inline-block; background: #2a3542; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin: 2px; }
.tag .remove { color: #e74c3c; cursor: pointer; margin-right: 6px; font-weight: bold; }
.alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
.alert.success { background: #064e3b; color: #6ee7b7; }
.alert.error { background: #7f1d1d; color: #fca5a5; }
</style>
</head>
<body>
<div class="container">

<div class="login-box" id="loginBox">
  <h1>🔐 پنل مدیریت</h1>
  <input type="password" id="pwd" placeholder="رمز عبور" onkeypress="if(event.key==='Enter')login()">
  <button onclick="login()">ورود</button>
</div>

<div class="hidden" id="panel">
  <h1>🛡️ پنل مدیریت</h1>
  <div id="alertBox"></div>

  <h2>👤 مدیریت کاربران</h2>
  <div class="card">
    <div id="usersList"></div>
  </div>

  <h2>➕ ساخت گروه جدید</h2>
  <div class="card">
    <div class="row">
      <input type="text" id="newGroupId" placeholder="شناسه گروه (انگلیسی)">
      <input type="text" id="newGroupName" placeholder="نام گروه">
      <input type="text" id="newGroupEmoji" placeholder="ایموجی" value="👥" maxlength="2">
    </div>
    <button class="btn success" onclick="createGroup()">ساخت گروه</button>
  </div>

  <h2>👥 گروه‌ها</h2>
  <div id="groupsList"></div>

  <h2>🗑️ حذف داده‌ها</h2>
  <div class="card">
    <div class="row">
      <button class="btn danger" onclick="clearOffline()">حذف پیام‌های آفلاین</button>
      <button class="btn danger" onclick="clearGroups()">حذف پیام‌های گروه</button>
    </div>
  </div>
</div>

</div>
<script>
const SUPABASE_URL = 'https://wspvdrxsdbmpomeuczwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SDXc2OU1Sy77WPdnBrxyWw_aT3josm9';
const ADMIN_PASSWORD = 'mani5955adminforall#$58';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function login() {
  if (document.getElementById('pwd').value === ADMIN_PASSWORD) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    loadUsers(); loadGroups();
  } else alert('رمز اشتباه');
}

function showAlert(msg, type) {
  const b = document.getElementById('alertBox');
  b.innerHTML = `<div class="alert ${type}">${msg}</div>`;
  setTimeout(() => b.innerHTML = '', 4000);
}

async function loadUsers() {
  const { data } = await sb.from('profiles').select('*').order('display_name');
  const list = document.getElementById('usersList');
  list.innerHTML = '';
  (data || []).forEach(u => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div style="flex:1;">
        <b>${u.display_name}</b> <span style="color:#666;">(@${u.id})</span>
        <span style="color:${u.is_active ? '#10b981' : '#e74c3c'};margin-right:8px;">
          ${u.is_active ? '✅ فعال' : '🚫 غیرفعال'}
        </span>
      </div>
      <button class="btn ${u.is_active ? 'danger' : 'success'}" onclick="toggleUser('${u.id}', ${u.is_active})">
        ${u.is_active ? 'غیرفعال (حذف)' : 'فعال کردن'}
      </button>
    `;
    list.appendChild(div);
  });
}

async function toggleUser(userId, currentState) {
  const newState = !currentState;
  const msg = newState ? 'فعال' : 'غیرفعال (حذف)';
  if (!confirm(`کاربر ${userId} ${msg} شود؟`)) return;
  const { error } = await sb.from('profiles').update({ is_active: newState }).eq('id', userId);
  if (error) return showAlert('خطا: ' + error.message, 'error');
  showAlert(`کاربر ${msg} شد`, 'success');
  loadUsers();
}

async function loadGroups() {
  const { data: groups } = await sb.from('rooms').select('*').order('created_at');
  const { data: members } = await sb.from('room_members').select('*');
  const { data: profiles } = await sb.from('profiles').select('*').order('display_name');
  const list = document.getElementById('groupsList');
  list.innerHTML = '';
  if (!groups || groups.length === 0) { list.innerHTML = '<div class="card">هنوز گروهی نیست</div>'; return; }

  groups.forEach(g => {
    const gm = (members || []).filter(m => m.room_id === g.id);
    const tags = gm.map(m => {
      const p = (profiles || []).find(x => x.id === m.user_id);
      return `<span class="tag">${p ? p.display_name : m.user_id} <span class="remove" onclick="removeMember('${g.id}','${m.user_id}')">×</span></span>`;
    }).join('') || '<em style="color:#666;">بدون عضو</em>';
    const notMembers = (profiles || []).filter(p => !gm.find(m => m.user_id === p.id));

    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div style="flex:1;">
        <div><b>${g.avatar_emoji} ${g.name}</b> <span style="color:#666;font-size:12px;">(${g.id})</span></div>
        <div style="margin-top:8px;">${tags}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <select id="add-${g.id}" style="padding:8px;background:#1c2733;border:1px solid #2a3542;border-radius:8px;color:white;">
          <option value="">افزودن...</option>
          ${notMembers.map(p => `<option value="${p.id}">${p.display_name}</option>`).join('')}
        </select>
        <button class="btn success" onclick="addMember('${g.id}')">افزودن</button>
        <button class="btn danger" onclick="deleteGroup('${g.id}')">حذف گروه</button>
      </div>`;
    list.appendChild(el);
  });
}

async function createGroup() {
  const id = document.getElementById('newGroupId').value.trim().toLowerCase();
  const name = document.getElementById('newGroupName').value.trim();
  const emoji = document.getElementById('newGroupEmoji').value.trim() || '👥';
  if (!id || !name) return showAlert('شناسه و نام الزامی است', 'error');
  if (!/^[a-z0-9_-]{2,30}$/.test(id)) return showAlert('شناسه نامعتبر', 'error');
  const { error } = await sb.from('rooms').insert({ id, name, avatar_emoji: emoji });
  if (error) return showAlert('خطا: ' + error.message, 'error');
  showAlert('گروه ساخته شد ✅', 'success');
  document.getElementById('newGroupId').value = '';
  document.getElementById('newGroupName').value = '';
  loadGroups();
}

async function deleteGroup(id) {
  if (!confirm('گروه و پیام‌هایش حذف شوند؟')) return;
  await sb.from('group_messages').delete().eq('room_id', id);
  await sb.from('room_members').delete().eq('room_id', id);
  await sb.from('rooms').delete().eq('id', id);
  showAlert('گروه حذف شد', 'success');
  loadGroups();
}

async function addMember(gid) {
  const sel = document.getElementById('add-' + gid);
  if (!sel.value) return;
  const { error } = await sb.from('room_members').insert({ room_id: gid, user_id: sel.value });
  if (error) return showAlert('خطا: ' + error.message, 'error');
  showAlert('عضو اضافه شد', 'success');
  loadGroups();
}

async function removeMember(gid, uid) {
  if (!confirm('عضو حذف شود؟')) return;
  await sb.from('room_members').delete().eq('room_id', gid).eq('user_id', uid);
  loadGroups();
}

async function clearOffline() {
  if (!confirm('همه پیام‌های آفلاین حذف شوند؟')) return;
  await sb.from('offline_messages').delete().neq('id', 0);
  showAlert('حذف شد', 'success');
}

async function clearGroups() {
  if (!confirm('همه پیام‌های گروه حذف شوند؟')) return;
  await sb.from('group_messages').delete().neq('id', 0);
  showAlert('حذف شد', 'success');
}
</script>
</body>
</html>
